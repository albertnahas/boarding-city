<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code City</title>
<style>
:root{--bg:#0a0d16;--panel:#121726ee;--ink:#e8ecf5;--mute:#8b93a7;--acc:#5eead4;--flow:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
#panel{z-index:6;position:absolute;top:12px;right:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid #ffffff14;border-radius:12px;padding:14px 16px;backdrop-filter:blur(6px)}
#crumbs{font-size:12px;color:var(--mute);margin-bottom:6px}#crumbs a{color:var(--acc);cursor:pointer;text-decoration:none}
h2{margin:0 0 6px;font-size:18px}.sub{color:var(--mute);font-size:12px}
.list{margin:10px 0 0;padding:0;list-style:none}.list li{padding:6px 8px;border-radius:6px;cursor:pointer}.list li:hover{background:#ffffff0d}
.list b{font-weight:600}.list span{display:block;color:var(--mute);font-size:12px}
pre{background:#05070d;border-radius:8px;padding:8px;font-size:11.5px;overflow:auto;color:#cbd5e1;margin:10px 0 0}
#bar{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:6}
button{background:#1c2335;color:var(--ink);border:1px solid #ffffff1f;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button.primary{background:var(--flow);color:#1a1300;border:none;font-weight:600}
#step{color:var(--flow);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tag{position:absolute;pointer-events:none;font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;background:#000a;white-space:nowrap;transform:translate(-50%,-100%)}
.ftag{transform:translate(0,-50%);font-weight:500;font-size:11.5px;background:#0a0d16cc;border:1px solid #ffffff14}.ftag.on{color:var(--flow)!important;border-color:#fbbf2466;font-weight:600}
.hoptag{transform:translate(-50%,-50%);font-size:10.5px;font-weight:500;background:#1a1300dd;border:1px dashed #fbbf24aa}
#backBtn[hidden]{display:none}
#paper{position:absolute;inset:0;z-index:14;background:#05070dcc;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}#paper[hidden]{display:none}
#paper .sheet{position:relative;width:min(920px,100%);max-height:100%;overflow:auto;background:#f3eee1;color:#1f1b16;border-radius:4px;padding:22px 26px;box-shadow:0 20px 60px #000c;font:15px/1.45 Georgia,"Times New Roman",serif}
#paper header{text-align:center;border-bottom:3px double #1f1b16;padding-bottom:8px;margin-bottom:14px}
#paper h1{margin:4px 0 2px;font:900 clamp(30px,6vw,58px)/1 "Old English Text MT","UnifrakturMaguntia","Times New Roman",serif;letter-spacing:.5px}

#paperBody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px}
#paperBody section{border-top:1px solid #1f1b1640;padding-top:10px;min-width:0}#paperBody section.lead{grid-column:1/-1;border-top:0;text-align:center}
#paperBody h2{margin:0 0 6px;font:800 21px/1.12 "Times New Roman",Georgia,serif;text-transform:uppercase;letter-spacing:.2px}#paperBody .lead h2{font-size:clamp(26px,4.4vw,40px)}
#paperBody p{margin:0 0 8px;font-style:italic;color:#3b342c}
#paperBody button{background:transparent;border:1px solid #1f1b16;color:#1f1b16;border-radius:2px;padding:4px 10px;font:600 12px Georgia,serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
#paperBody button:hover{background:#1f1b16;color:#f3eee1}#paperBody button:focus-visible,#paperClose:focus-visible{outline:2px solid #b45309;outline-offset:2px}
#paper footer{margin-top:16px;border-top:3px double #1f1b16;padding-top:6px;font:11px Georgia,serif;color:#5c544a;text-align:center}

@media (max-width:640px){#paperBody{grid-template-columns:1fr}#paper .sheet{padding:16px}}
#player{position:absolute;z-index:9;bottom:12px;left:274px;right:232px;max-width:none;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--panel);border:1px solid #ffffff1f;border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px)}
#player[hidden],#plList[hidden]{display:none}
#plRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}#plRow button,#plRow select{padding:5px 9px;font-size:13px}#plRow select{background:#1c2335;color:var(--ink);border:1px solid #ffffff1f;border-radius:8px}
#plLoop.on{background:var(--acc);color:#04201b;border:none}#plTitle{font-size:12px;font-weight:600;color:var(--flow)}

#plTrack b.done{opacity:.85}#plTrack b.cur{opacity:1;border-color:#fff;transform:scale(1.2)}
#plInfo{font-size:12px;color:var(--mute);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#plInfo code{color:var(--ink);font:12px ui-monospace,Menlo,monospace}

#plList li>i{font-style:normal;font-weight:700;color:var(--flow)}#plList li span{grid-column:2;color:var(--mute);font-size:12px}#plList .bd{font-size:10.5px;padding:0 6px;border-radius:999px;border:1px solid #8b93a766;color:var(--mute);margin-left:6px}#plList .bd.ind{border-style:dashed}
#app.isolated:has(#player:not([hidden])) #isoFig{padding-bottom:118px}
.mtag.cur{background:#fff;color:#e11d48;border-color:#e11d48;box-shadow:0 0 0 4px #e11d4866}

#layers{position:absolute;left:12px;bottom:12px;z-index:6;width:250px;font-size:11px;max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border:1px solid #ffffff14;border-radius:12px;padding:10px 12px;font-size:12px}
#layers summary{cursor:pointer;font-weight:600;font-size:13px}#layers label{display:grid;grid-template-columns:16px 1fr auto;gap:0 6px;align-items:start;margin-top:5px;cursor:pointer}
#layers label input{margin:2px 0 0}#layers label b{font-weight:600}#layers label i{grid-column:2/4;font-style:normal;color:var(--mute);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#layers label em{font-style:normal;color:var(--mute);font-size:11px}
#layers .detail{margin-top:8px;color:var(--mute);border-top:1px solid #ffffff14;padding-top:6px;line-height:1.4}
.mtag{transform:translate(-50%,-50%);background:#e11d48;color:#fff;border-radius:999px;min-width:20px;text-align:center;padding:2px 6px;font-size:11px;border:2px solid #fff}
.ltag{transform:translate(-50%,-100%);font-size:11.5px;background:#000c;border:1px solid #ffffff22}
#app.isolated #layers{display:none}
@media (max-width:700px){#layers{width:auto;left:8px;right:auto;bottom:auto;top:56px;max-height:30%}#layers[open]{right:8px}}
#iso{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column}#iso[hidden]{display:none}
#isoBg{position:absolute;inset:0;opacity:0}

#isoModal img{max-width:100%;max-height:60vh;border-radius:8px;border:1px solid #ffffff22;justify-self:center}
#isoModal textarea,#isoModal input{width:100%;background:#05070d;color:#cbd5e1;border:1px solid #ffffff22;border-radius:8px;padding:8px;font:12px ui-monospace,Menlo,monospace}
#isoModal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#isoModal a{color:var(--acc)}
.list .chip,.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:999px;margin-left:6px;border:1px solid #8b93a766;color:var(--mute);vertical-align:1px}.chip.traced{border-color:#5eead488;color:var(--acc)}
.mods{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px}.mods b{font-size:12px}.mods span{color:var(--ink);font-size:12.5px}.mods a{color:var(--acc);cursor:pointer}
.note{font-size:12px;color:var(--mute);margin-top:4px}
h4{margin:14px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.list li.flowitem b{color:var(--flow)}.list li .files{font-size:11px;color:#6b7489}
button.ghost{background:transparent;border:1px solid #fbbf2466;color:var(--flow);margin-top:8px;padding:6px 10px;font-size:13px}
#modeBtn.on{background:var(--acc);color:#04201b;border:none;font-weight:600}
.ntag{max-width:var(--pill,160px);overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,-50%);font-size:11px;font-weight:600;background:#0a0d16e6;border:1px solid #ffffff1f;color:#e8ecf5}
.ntag.hot{border-color:#fbbf24aa;color:#fbbf24}
.dtag{transform:translate(-50%,-100%);font-size:13px}
.ftag2{max-width:var(--box,160px);overflow:hidden;text-overflow:ellipsis;transform:translate(0,-50%);font-size:10.5px;font-weight:500;color:#8b93a7;background:none;padding:0}
#hover{position:absolute;pointer-events:none;font-size:12px;padding:3px 8px;border-radius:6px;background:#000c;border:1px solid #ffffff22;white-space:nowrap;transform:translate(12px,-50%);display:none;z-index:5}
@media (max-width:700px){#panel{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:42%}#bar{left:8px;top:8px}}
</style></head><body>
<div id="app"><div id="bar"><button id="galleryBtn" class="primary">▶ Flow gallery</button><button id="paperBtn" title="The Daily Commit: the city's tabloid">📰 Daily Commit</button><button id="modeBtn">2D diagram</button><button id="homeBtn">City view</button><button id="backBtn" hidden>← Back to city</button></div><div id="hover"></div>

<div id="plTrack"></div><div id="plInfo"></div></div><ol id="plList" hidden></ol>
<div id="iso" hidden><div id="isoBg"></div><div id="isoBar"><button id="isoBack">← Back to city</button><button id="isoTheme">Light background</button><button id="isoMermaid" class="primary">Copy as Mermaid</button><button id="isoPng" class="primary">Save as PNG</button><button id="isoLinkBtn">Copy link</button><span class="st" id="isoSt"></span></div><div id="isoFig"></div></div>
<div id="isoModal" hidden><div class="card" id="isoCard"></div></div>
<div id="panel"><div id="crumbs"></div><div id="body"></div></div><details id="layers" open><summary>Layers</summary><div id="layerList"></div></details></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
const D=__DATA__;
const COLORS=(D.colors||["#2dd4bf","#f59e0b","#8b5cf6","#f43f5e","#60a5fa","#84cc16"]).map(c=>parseInt(c.slice(1),16));
const app=document.getElementById("app"),panel=document.getElementById("body"),crumbs=document.getElementById("crumbs");
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));app.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0d16);scene.fog=new THREE.Fog(0x0a0d16,60,140);
const camera=new THREE.PerspectiveCamera(40,1,0.1,1200);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=1.35;controls.minDistance=3;controls.maxDistance=90;
const hemi=new THREE.HemisphereLight(0xbfd4ff,0x101018,1.1);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(20,40,15);scene.add(sun);
const grid=new THREE.GridHelper(400,160,0x1b2236,0x121828);grid.position.y=-0.05;scene.add(grid);

// ---- layout: districts in a 2x2 grid, files as buildings, functions as floors ----
const byPath=Object.fromEntries(D.files.map(f=>[f.path,f])),fileDistrict={};
D.districts.forEach((d,i)=>d.files.forEach(p=>fileDistrict[p]=i));
const cityGroups=[],loader=new THREE.TextureLoader(),pickables=[],buildings={},floors={},tags=[];
const short=p=>p.endsWith("(block)")?p.split("/").slice(-2).join("/"):p.split("/").pop();
const CELL=3.2,GAP=5,COLS=Math.ceil(Math.sqrt(D.districts.length));
const sizes=D.districts.map(d=>{const c=Math.ceil(Math.sqrt(d.files.length));return Math.max(c,Math.ceil(d.files.length/c))*CELL+2.4});
const colW=[...Array(COLS)].map((_,c)=>Math.max(...sizes.filter((_,i)=>i%COLS===c))),rowH=[...Array(Math.ceil(sizes.length/COLS))].map((_,r)=>Math.max(...sizes.slice(r*COLS,r*COLS+COLS)));
const W=colW.reduce((a,b)=>a+b)+GAP*(COLS-1),HH=rowH.reduce((a,b)=>a+b)+GAP*(rowH.length-1),EXT=Math.max(W,HH);
const heightOf=lines=>Math.max(0.6,0.34*Math.sqrt(lines));
D.districts.forEach((d,i)=>{
  const n=d.files.length,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),size=sizes[i],c=i%COLS,r=Math.floor(i/COLS);
  const cx=-W/2+colW.slice(0,c).reduce((a,b)=>a+b,0)+GAP*c+colW[c]/2,cz=-HH/2+rowH.slice(0,r).reduce((a,b)=>a+b,0)+GAP*r+rowH[r]/2;
  const tex=loader.load(`d${i%4}.jpg`);tex.colorSpace=THREE.SRGBColorSpace;
  const plate=new THREE.Mesh(new THREE.BoxGeometry(size,0.3,size),[0,0,new THREE.MeshStandardMaterial({map:tex,roughness:.9}),0,0,0].map(m=>m||new THREE.MeshStandardMaterial({color:COLORS[i],roughness:.8})));
  plate.position.set(cx,0,cz);plate.userData={kind:"district",i};scene.add(plate);pickables.push(plate);
  d.center=new THREE.Vector3(cx,0,cz);d.size=size;
  tags.push({el:tag(d.name,COLORS[i]),pos:new THREE.Vector3(cx,0.5,cz-size/2)});
  d.files.forEach((p,j)=>{
    const f=byPath[p],x=cx-((cols-1)*CELL)/2+(j%cols)*CELL,z=cz-((rows-1)*CELL)/2+Math.floor(j/cols)*CELL;
    const H=heightOf(f.cluster&&D.blockHeightCap?Math.min(f.lines,D.blockHeightCap):f.lines),fns=f.functions.length?f.functions:[{name:f.cluster?"(block of small files)":"(module body)",line:1,snippet:""}];
    const g=new THREE.Group();g.position.set(x,0.15,z);scene.add(g);cityGroups.push(g);buildings[p]={group:g,H,x,z};floors[p]={};
    // each function = one floor, height proportional to the lines it spans
    let y=0;fns.forEach((fn,k)=>{
      const end=k+1<fns.length?fns[k+1].line:f.lines,h=Math.max(0.12,H*(Math.max(1,end-fn.line)/Math.max(1,f.lines-fns[0].line+1)));
      const col=new THREE.Color(COLORS[i]).lerp(new THREE.Color(0xffffff),k%2?0.18:0.0).multiplyScalar(0.75);
      const m=new THREE.Mesh(new THREE.BoxGeometry(f.cluster?2.6:1.9,h*0.92,f.cluster?2.6:1.9),new THREE.MeshStandardMaterial({color:col,roughness:.45,metalness:.15,emissive:0x000000}));
      m.position.y=y+h/2;y+=h;m.userData={kind:"fn",path:p,fn,y0:y-h/2,gh:h*0.92};g.add(m);pickables.push(m);floors[p][fn.name]??=m;
    });
    buildings[p].H=y;
  });
});
// label the landmark buildings (biggest files) so the city is recognisable from above
// landmark labels: files on a walkthrough or holding user entry points first, then size; constants, types, generated
// files and locales go last so they never win a label just by being long
const FLOWFILES=new Set(D.flows.flatMap(F=>F.steps.map(s=>s.path))),ENTRYFILES=new Set((D.layers?.entries||[]).map(e=>e[0]));
const landmarkScore=f=>(FLOWFILES.has(f.path)?2:0)+(ENTRYFILES.has(f.path)?1:0)-(/(constants?|types?|generated|\.d\.ts|locales?|icons?|schema)\b|\.json$/i.test(f.path)?3:0);
const landmarks=n=>D.files.filter(f=>!f.cluster).sort((a,b)=>landmarkScore(b)-landmarkScore(a)||b.lines-a.lines).slice(0,n);
landmarks(8).forEach(f=>{const b=buildings[f.path];tags.push({el:tag(short(f.path),0xe8ecf5),pos:new THREE.Vector3(b.x,b.H+0.6,b.z)})});
const MAXH=Math.max(...Object.values(buildings).map(b=>b.H)),CITY=new THREE.Vector3(0,MAXH*0.5,0),CITYD=Math.max(EXT*1.35,MAXH*3.5);
scene.fog=new THREE.Fog(0x0a0d16,EXT*1.1,EXT*3);controls.maxDistance=EXT*2.2;
tags.forEach(t=>t.city=true);
// ---- city layers: every layer comes from static analysis of the source (layers.py), never decoration ----
const LY=D.layers,home=D.home||{},bOf=p=>buildings[home[p]||p],dOf=p=>fileDistrict[home[p]||p];
const ON={roads:true,traffic:true,metro:true,ghost:true,buses:false,flights:false,power:false,cranes:false,night:false};
const LG={};for(const k of ["roads","traffic","buses","flights","power","cranes","ghost"]){const g=new THREE.Group();g.visible=false;scene.add(g);LG[k]=g}
const DETAIL=new THREE.Group(),LAND=new THREE.Group();scene.add(DETAIL,LAND);
const dummy=new THREE.Object3D(),V=(x,y,z)=>new THREE.Vector3(x,y,z);
function inst(geo,mat,n,group){const m=new THREE.InstancedMesh(geo,mat,Math.max(1,n));m.count=n;m.frustumCulled=false;group.add(m);return m}
// streets: the gaps between building columns/rows of each district, outermost ones form the ring road
const ST=D.districts.map(d=>{const n=d.files.length,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),cx=d.center.x,cz=d.center.z;
  return {xs:[...Array(cols+1)].map((_,c)=>cx-((cols-1)*CELL)/2+(c-0.5)*CELL),zs:[...Array(rows+1)].map((_,r)=>cz-((rows-1)*CELL)/2+(r-0.5)*CELL),cx,cz,size:d.size}});
const near=(arr,v)=>arr.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);
function gate(i,j){const a=ST[i],b=ST[j],dx=b.cx-a.cx,dz=b.cz-a.cz;return Math.abs(dx)>Math.abs(dz)?{side:"x",p:V(a.cx+Math.sign(dx)*a.size/2,0.22,near(a.zs,a.cz))}:{side:"z",p:V(near(a.xs,a.cx),0.22,a.cz+Math.sign(dz)*a.size/2)}}
const Y=0.22,streetPt=b=>V(b.x+CELL/2,Y,b.z);
