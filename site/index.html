<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Explore a codebase as a 3D city and follow real user actions through the code.">
<title>Boarding City</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Layout: one full-viewport app. A slim bar (name, repository link + switcher, fullscreen) over a full-bleed city. */
:root{--bg:#0a0d16;--bar:#0f1320;--field:#151b2b;--line:#ffffff1a;--ink:#e8ecf5;--mute:#8b93a7;--acc:#5eead4;color-scheme:dark;
  --ui:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);overflow:hidden}
#shell{height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{position:relative;z-index:4;display:flex;align-items:center;gap:12px;min-height:48px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:15px;font-weight:700;white-space:nowrap}
h1 .mark{color:var(--acc)}h1 small{color:var(--mute);font-weight:500}
.repo{position:relative;min-width:0;display:flex;align-items:stretch;height:34px;background:var(--field);border:1px solid var(--line);border-radius:8px}
.repo svg{flex:none}
#repoLink{min-width:0;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--ink);text-decoration:none;font:13px var(--mono);border-radius:8px 0 0 8px}
#repoLink:hover{background:#ffffff08}#repoLink:hover .url{text-decoration:underline}
#repoLink .url{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#repoLink .sha{flex:none;color:var(--mute);font-size:12px}#repoLink .ext{flex:none;color:var(--mute)}
#switch{flex:none;display:flex;align-items:center;gap:6px;background:var(--acc);color:#04201b;border:0;border-radius:0 7px 7px 0;padding:0 12px;font:700 13px var(--ui);cursor:pointer;white-space:nowrap}
#switch:hover{filter:brightness(1.08)}#switch .kbd{color:#04201b;border-color:#04201b55}
.kbd{font:11px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-weight:400}
#menu{position:absolute;top:calc(100% + 6px);right:0;min-width:min(380px,calc(100vw - 32px));background:#121726;border:1px solid #ffffff26;border-radius:10px;padding:6px;box-shadow:0 12px 40px #000a;display:grid;gap:2px}
#menu[hidden]{display:none}
#menu .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px 8px 2px}
#menu [role=option]{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px;border-radius:7px;cursor:pointer;outline:none}
#menu [role=option]:hover,#menu [role=option]:focus-visible,#menu [role=option].active{background:#ffffff10}
#menu .nm{font:600 13px var(--mono)}#menu .cur{color:var(--acc);font-size:12px}
#menu .st{grid-column:1/-1;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
#menu .map{display:grid;gap:6px;padding:8px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
#menu .map .lbl{padding:0;color:var(--acc);font-weight:700}
#menu .maprow{display:flex;gap:6px}
#menu .maprow input{flex:1;min-width:0;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:13px var(--mono)}
#menu .maprow button{flex:none;background:var(--acc);color:#04201b;border:0;border-radius:7px;padding:0 12px;font:700 13px var(--ui);cursor:pointer}
#menu .hint{color:var(--mute);font-size:12px}
#menu .older summary{cursor:pointer;color:var(--mute);font-size:12px;padding:2px 8px 6px;list-style-position:inside}
#menu .older summary:hover{color:var(--ink)}
#fs{flex:none;background:#1c2335;color:var(--ink);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 12px;font:600 13px var(--ui);cursor:pointer;white-space:nowrap}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#121726f2;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;z-index:3}
#toast[hidden]{display:none}
@media (max-width:820px){.kbd{display:none}}@media (max-width:1100px){h1 small{display:none}}
@media (max-width:600px){header{gap:8px}#fs .t,#repoLink .sha,#repoLink .host,h1 .name,#switch .t{display:none}}
/* ---- build a city ---- */
.sheet{position:absolute;z-index:6;top:10px;right:max(16px,env(safe-area-inset-right,0px));width:min(440px,calc(100vw - 32px));max-height:calc(100% - 20px);overflow:auto;background:#121726f7;border:1px solid #ffffff26;border-radius:12px;box-shadow:0 16px 48px #000b;padding:16px;display:grid;gap:12px}
.sheet[hidden]{display:none}
.sheet h2{margin:0;font-size:16px}.sheet p{margin:0;color:var(--mute)}
.sheet label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.sheet input[type=text],.sheet input[type=number],.sheet select,.sheet textarea{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:13px var(--ui);min-width:0}
.sheet textarea{min-height:58px;resize:vertical;font:13px var(--mono)}
.sheet .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sheet .checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink)}
.sheet .checks label{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:13px}
.sheet details summary{cursor:pointer;color:var(--ink);font-weight:600}
.sheet details[open] summary{margin-bottom:10px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:#1c2335;color:var(--ink);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 12px;font:600 13px var(--ui);cursor:pointer}
.btn.primary{background:var(--acc);color:#04201b;border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.x{position:absolute;top:10px;right:10px;background:transparent;border:0;color:var(--mute);font-size:18px;cursor:pointer}
.est{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:4px;background:#0c1019}
.est b{font-size:15px}.est .warn{color:#fbbf24}.est .err{color:#fca5a5}.est .capnote{font-size:12px;color:var(--mute)}.est .capnote a{color:var(--acc)}
#prog{position:absolute;z-index:5;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;width:min(380px,calc(100vw - 32px));background:#121726f2;border:1px solid #ffffff26;border-radius:12px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 12px 40px #000a}
#prog[hidden]{display:none}
#prog .top{display:flex;align-items:baseline;gap:8px}#prog .top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog .meter{height:6px;border-radius:3px;background:#ffffff14;overflow:hidden}#prog .meter i{display:block;height:100%;background:var(--acc);transition:width .6s}
#prog ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
#prog ol li{font:11px var(--mono);padding:2px 6px;border-radius:5px;background:#ffffff0d;color:var(--mute)}
#prog ol li.on{background:#5eead433;color:var(--ink)}#prog ol li.done{color:var(--acc)}
#prog .log{max-height:110px;overflow:auto;font-size:12px;color:var(--mute);display:grid;gap:2px}
#prog .log div:last-child{color:var(--ink)}
#prog .err{color:#fca5a5}
.tabular{font-variant-numeric:tabular-nums}
</style>

<div id="shell">
  <header>
    <h1><span class="mark" aria-hidden="true">▦</span> <span class="name">Boarding City</span> <small>· Show your repository skyline</small></h1>
    <div class="repo">
      <a id="repoLink" target="_blank" rel="noopener" title="Open on GitHub">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
        <span class="url"><span class="host">github.com/</span><span id="repoName"></span></span><span class="sha" id="sha"></span><span class="ext" aria-hidden="true">↗</span>
      </a>
      <button type="button" id="switch" aria-haspopup="listbox" aria-expanded="false" aria-controls="menu" title="Map a new GitHub repo or open one already built (Ctrl/⌘ K)">＋<span class="t"> Map or switch repo</span> ▾ <span class="kbd" aria-hidden="true">⌘K</span></button>
      <div id="menu" role="listbox" aria-label="Mapped repositories" hidden></div>
    </div>
    <span class="spacer"></span>
    <button type="button" id="fs" title="Fullscreen (Esc to exit)" aria-label="Fullscreen">⛶<span class="t"> Fullscreen</span></button>
  </header>
  <main><iframe id="city" title="Boarding City" allow="fullscreen"></iframe><div id="toast" role="status" hidden></div>
    <form class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
      <button type="button" class="x" id="sheetX" aria-label="Close">✕</button>
      <h2 id="sheetTitle">Map a GitHub repo</h2>
      <p>Any public JavaScript or TypeScript repository on GitHub. You'll see the time and cost first.</p>
      <label>Repository (pin a commit with @sha, @branch or @tag)<input type="text" id="fRepo" name="repo" placeholder="owner/name or github.com/owner/name" autocomplete="off" spellcheck="false" required></label>
      <details id="fMore"><summary>Settings</summary>
        <div style="display:grid;gap:10px">
          <div class="row"><label>Walkthroughs<input type="number" id="fFlows" min="1" max="10" value="6"></label>
            <label>Max source files<input type="number" id="fMax" min="20" max="1500" step="10" value="1500"></label></div>
          <label>Walkthroughs you want (optional, one per line; replaces the automatic picks)<textarea id="fReq" placeholder="export as PNG&#10;undo the last change"></textarea></label>
          <div class="row"><label>Fast model (picking files, names)<select id="fFast"></select></label>
            <label>Trace model (walkthroughs)<select id="fTrace"></select></label>
            <label>Reasoning effort<select id="fEffort"><option>low</option><option>medium</option><option>high</option></select></label></div>
          <div class="checks" role="group" aria-label="Features"><label><input type="checkbox" id="fLayers" checked> City layers</label><label><input type="checkbox" id="fFog" checked> Fog of war</label>
            <label><input type="checkbox" id="fTabloid" checked> Daily Commit</label><label><input type="checkbox" id="fGhost" checked> Ghost town</label></div>
          <div class="checks"><label><input type="checkbox" id="fCache" checked> Reuse an identical build if one exists</label></div>
        </div></details>
      <div class="est" id="est" hidden aria-live="polite"></div>
      <div class="actions"><button type="submit" class="btn" id="fEstimate">Estimate</button><button type="button" class="btn primary" id="fBuild" hidden>Build city</button></div>
    </form>
    <section id="prog" hidden aria-live="polite" aria-label="Build progress">
      <div class="top"><b id="pTitle"></b><span class="tabular" id="pPct"></span><button type="button" class="x" style="position:static" id="pX" aria-label="Hide progress">✕</button></div>
      <div class="meter"><i id="pBar" style="width:0"></i></div>
      <ol id="pStages"></ol>
      <div class="log" id="pLog"></div>
      <div class="tabular" id="pCost" style="font-size:12px;color:var(--mute)"></div>
    </section></main>
</div>

<script>
// The cities shipped with this page.
const REPOS=[  // generated by `python -m boarding_city site` from site/repos.json
  {key:"excalidraw",repo:"excalidraw/excalidraw",sha:"7ded689",src:"excalidraw/demo.html",files:425,flows:8,cost:"$0.25"},
  {key:"supabase",repo:"supabase/supabase",sha:"c7baea1",src:"supabase/demo.html",files:6847,sampled:183,flows:6,cost:"$0.10"}];
const $=id=>document.getElementById(id),city=$("city"),shell=$("shell"),link=$("repoLink"),sw=$("switch"),menu=$("menu");
let current=null;
function show(r){$("repoName").textContent=r.repo;$("sha").textContent="@ "+r.sha;
  link.href=`https://github.com/${r.repo}/tree/${r.sha}`;link.title=`Open ${r.repo} at commit ${r.sha} on GitHub`;link.setAttribute("aria-label",link.title)}
// routes: #excalidraw, #supabase, or #<key>-flow-<id> to open one isolated flow
function route(){if(dynamicRoute())return;const m=location.hash.match(/^#([a-z0-9]+)(?:-flow-([\w-]+))?$/),r=REPOS.find(x=>m&&x.key===m[1])||REPOS[0],hash=m&&m[2]?"#flow-"+m[2]:"";
  if(r!==current){current=r;city.src=r.src+hash}else if(hash){try{city.contentWindow.location.hash=hash}catch{}}show(r)}
addEventListener("hashchange",route);
function focusCity(){try{city.contentWindow.focus()}catch{}}
city.addEventListener("load",focusCity);
// ---- repository switcher ----
const opts=()=>[...menu.querySelectorAll("[role=option]")].filter(o=>o.offsetParent);  // not those in a closed disclosure
function openMenu(){menu.innerHTML=`<form class="map" id="mapForm"><label class="lbl" for="mapRepo">Show your repository skyline: map any GitHub repo</label>
  <div class="maprow"><input id="mapRepo" type="text" placeholder="owner/repo or a github.com URL" autocomplete="off" spellcheck="false" aria-describedby="mapHint"><button>Estimate</button></div>
  <div class="hint" id="mapHint">Public JavaScript or TypeScript repos · pin a commit with @sha, @branch or @tag · you see time and cost first</div></form>
  <div class="lbl">Ready to explore</div>`+REPOS.map(r=>`<div role="option" tabindex="-1" data-key="${r.key}" aria-selected="${r===current}">
  <span class="nm">${r.repo}</span>${r===current?'<span class="cur">current</span>':"<span></span>"}<span class="st">${stats(r)}</span></div>`).join("");
  // recently built, one row per repo (newest commit); its older commits sit behind a disclosure
  const byRepo=Object.values(RECENT.reduce((g,m)=>((g[m.repo]||=[]).push(m),g),{}));
  menu.insertAdjacentHTML("beforeend",byRepo.length?`<div class="lbl">Recently built</div>`+byRepo.map(([m,...older])=>recentRow(m)+(older.length
    ?`<details class="older"><summary>${older.length} older commit${older.length>1?"s":""} of ${esc(m.repo)}</summary>${older.map(recentRow).join("")}</details>`:"")).join(""):"");
  menu.hidden=false;sw.setAttribute("aria-expanded","true");$("mapRepo").focus()}
// a large repo is sampled: its cost covers the buildings shown, not every file
function stats(m){const files=(+m.files).toLocaleString("en");
  return `${m.sampled?`sampled ${m.sampled} of ${files} files`:`${files} files`} · ${m.flows} walkthrough${m.flows==1?"":"s"} · built for $${(+String(m.cost).replace("$","")).toFixed(2)} · @${esc(m.sha)}`}
function recentRow(m){return `<div role="option" tabindex="-1" data-share="${esc(shareHash(m))}" aria-selected="${current?.key===m.key}">
  <span class="nm">${esc(m.repo)}</span>${current?.key===m.key?'<span class="cur">current</span>':"<span></span>"}<span class="st">${stats(m)}</span></div>`}
function closeMenu(refocus){menu.hidden=true;sw.setAttribute("aria-expanded","false");if(refocus)sw.focus()}
function pick(key){closeMenu();if(location.hash==="#"+key)route();else location.hash=key;focusCity()}
sw.onclick=()=>{sheet.hidden=true;menu.hidden?openMenu():closeMenu()};
menu.addEventListener("click",e=>{const o=e.target.closest("[role=option]");if(o)o.dataset.share?openShare(o.dataset.share):pick(o.dataset.key)});
menu.addEventListener("submit",e=>{e.preventDefault();const v=$("mapRepo").value.trim();if(!v){$("mapRepo").focus();return}
  closeMenu();openSheet();$("fRepo").value=v;sheet.requestSubmit()});
menu.addEventListener("keydown",e=>{const L=opts(),i=L.indexOf(document.activeElement);
  if(e.target.closest("#mapForm")){if(e.key==="ArrowDown"&&L.length){e.preventDefault();L[0].focus()}else if(e.key==="Escape"){e.preventDefault();closeMenu(true)}return}
  if(e.key==="ArrowUp"&&i===0){e.preventDefault();$("mapRepo").focus();return}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();L[(i+(e.key==="ArrowDown"?1:L.length-1))%L.length].focus()}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();if(i>=0)L[i].dataset.share?openShare(L[i].dataset.share):pick(L[i].dataset.key)}
  else if(e.key==="Escape"||e.key==="Tab"){e.preventDefault();closeMenu(true)}});
document.addEventListener("pointerdown",e=>{if(!menu.hidden&&!e.target.closest(".repo"))closeMenu()});
addEventListener("blur",()=>{if(!menu.hidden&&document.activeElement===city)closeMenu()});  // a click inside the city frame
// ---- keyboard: Ctrl/⌘K opens the switcher; other keys pressed in the bar still drive the city ----
function onKey(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();menu.hidden?openMenu():closeMenu(true);return true}return false}
addEventListener("keydown",e=>{if(onKey(e)||e.ctrlKey||e.metaKey||e.altKey||!menu.hidden||["Tab"," ","Enter"].includes(e.key))return;
  try{if(city.contentWindow.cityAPI?.key(e.key)){e.preventDefault();focusCity()}}catch{}});
city.addEventListener("load",()=>{try{city.contentWindow.addEventListener("keydown",e=>{onKey(e)})}catch{}});
// ---- build a city: estimate first, then a fire-and-forget build that the page polls; the city fills in as it's built ----
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MODELS=["gpt-6-luna","gpt-6.1-terra","gpt-6.1-sol","gpt-5.5"],sheet=$("sheet"),est=$("est"),prog=$("prog");
let RECENT=[],lastEst=null,poll=0,watching=null,shownSnap=null,pendingSnap=null;
$("fFast").innerHTML=MODELS.map(m=>`<option${m==="gpt-6-luna"?" selected":""}>${m}</option>`).join("");
$("fTrace").innerHTML=MODELS.map(m=>`<option${m==="gpt-6.1-terra"?" selected":""}>${m}</option>`).join("");
if(location.protocol.startsWith("http"))fetch("/api/recent").then(r=>r.ok?r.json():[]).then(x=>RECENT=Array.isArray(x)?x:[]).catch(()=>{});
function params(){const req=$("fReq").value.split("\n").map(x=>x.trim()).filter(Boolean);
  return {flows:+$("fFlows").value||6,requests:req,fast_model:$("fFast").value,trace_model:$("fTrace").value,effort:$("fEffort").value,
    max_files:+$("fMax").value||1500,features:{layers:$("fLayers").checked,fog:$("fFog").checked,tabloid:$("fTabloid").checked,ghost:$("fGhost").checked}}}
function openSheet(){closeMenu();sheet.hidden=false;$("fRepo").focus()}
$("sheetX").onclick=()=>{sheet.hidden=true;focusCity()};
sheet.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Escape"){sheet.hidden=true;focusCity()}});
sheet.addEventListener("input",e=>{if(e.target.id!=="fCache"){$("fBuild").hidden=true;est.hidden=true;lastEst=null}});
async function api(path,body){const r=await fetch(path,body?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:{});
  let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||`The server answered ${r.status}. Try again in a moment.`);return [r.status,j]}
sheet.onsubmit=async e=>{e.preventDefault();const b=$("fEstimate");b.disabled=true;b.textContent="Estimating…";est.hidden=false;est.innerHTML="Counting the source files…";
  try{const [,j]=await api("/api/estimate",{repo:$("fRepo").value,params:params()});lastEst=j;
    const mins=j.minutes[0]===j.minutes[1]?`~${j.minutes[0]}`:`${j.minutes[0]}–${j.minutes[1]}`;
    est.innerHTML=j.cached?`<b>Already built</b><span>${esc(j.repo)} @ ${j.sha.slice(0,7)} with these settings opens instantly, for free.</span>`
      :j.too_big?`<b class="warn">Too big for an on-demand build</b><span>${esc(j.message)}</span>`
      :!j.builds?`<b class="warn">Live builds need the server's AI key, which isn't set up here yet</b><span>${esc(j.repo)} @ ${j.sha.slice(0,7)} · ${j.files.toLocaleString("en")} source files. Build it on your machine instead (about $${j.usd[0].toFixed(2)}–${j.usd[1].toFixed(2)} of OpenAI):</span><code style="font:12px var(--mono);user-select:all">python -m boarding_city build ${esc(j.repo)}@${j.sha.slice(0,7)}</code>`
      :`<b>This will take ~${mins} min and cost ~$${j.usd[0].toFixed(2)}–${j.usd[1].toFixed(2)}</b><span>${esc(j.repo)} @ ${j.sha.slice(0,7)} · ${j.files.toLocaleString("en")} source files · ~${j.lines.toLocaleString("en")} lines · ${j.library?`library: up to ${j.params.flows} API walkthroughs`:`up to ${j.params.flows} walkthroughs`}</span><span>${j.library?"No UI found, so the walkthroughs will be calls to its exported functions. ":""}The skyline appears within seconds; districts and walkthroughs fill in as they're ready.</span><span class="capnote">Public builds run on the author's OpenAI key and stop at $${j.cap.toFixed(2)}${j.capped?", so this one traces fewer walkthroughs":""}. To map the whole repository, <a href="https://github.com/albertnahas/boarding-city" target="_blank" rel="noopener">fork Boarding City on GitHub</a> and run it with your own key.</span>`;
    const go=$("fBuild");go.hidden=j.too_big||!(j.cached||j.builds);go.textContent=j.cached?"Open city":"Build city";go.disabled=false;if(!go.hidden)go.focus()}
  catch(err){est.innerHTML=`<b class="err">Couldn't estimate</b><span>${esc(err.message)}</span>`}
  finally{b.disabled=false;b.textContent="Estimate"}};
$("fBuild").onclick=async()=>{if(!lastEst)return;const go=$("fBuild");
  if(lastEst.cached&&$("fCache").checked){sheet.hidden=true;openCity(lastEst.cached);return}
  go.disabled=true;go.textContent="Starting…";
  try{const [code,j]=await api("/api/build",{repo:lastEst.repo,sha:lastEst.sha,params:lastEst.params,use_cache:$("fCache").checked});
    sheet.hidden=true;if(j.cached){openCity(j.city);return}location.hash="job="+j.job}
  catch(err){est.innerHTML+=`<span class="err">${esc(err.message)}</span>`;go.disabled=false;go.textContent="Build city"}};
// ---- cities built on demand and builds in progress ----
const shareHash=m=>`r=${m.repo}@${m.sha}&k=${m.key.split("__").pop()}`;
function openShare(h){closeMenu();location.hash=h}
function openCity(m){location.hash=shareHash(m)}
function cityUrl(path){return "/api/city?path="+encodeURIComponent(path)}
function loadCity(path,keepView){let v=null;try{v=keepView?city.contentWindow.cityAPI?.state():null}catch{}
  if(v)city.addEventListener("load",()=>setTimeout(()=>{try{city.contentWindow.cityAPI?.setView(v)}catch{}},400),{once:true});
  city.src=cityUrl(path);shownSnap=path}
function dynamicRoute(){const h=location.hash.slice(1),q=new URLSearchParams(h);
  if(q.get("job")){if(watching!==q.get("job"))watch(q.get("job"));return true}
  if(q.get("r")){const [repo,sha]=q.get("r").split("@"),k=q.get("k")||"";stopWatching();
    fetch(`/api/find?repo=${encodeURIComponent(repo)}&sha=${encodeURIComponent(sha||"")}&k=${encodeURIComponent(k)}`).then(r=>r.ok?r.json():Promise.reject(r))
      .then(m=>{if(current?.key!==m.key){current={...m,src:cityUrl(m.path)};loadCity(m.path)}show(current)})
      .catch(()=>{say("That city isn't built yet. Build it with ＋ Build a city.");location.hash=REPOS[0].key});return true}
  stopWatching();return false}
function stopWatching(){clearTimeout(poll);watching=null;prog.hidden=true}
function watch(job){stopWatching();watching=job;shownSnap=null;city.src="about:blank";prog.hidden=false;$("pTitle").textContent="Starting the build…";tick(job,1500)}
async function tick(job,delay){if(watching!==job)return;let st;
  try{[,st]=await api("/api/jobs/"+job)}catch(err){$("pLog").innerHTML=`<div class="err">${esc(err.message)}</div>`;poll=setTimeout(()=>tick(job,Math.min(delay*1.5,10000)),delay);return}
  if(watching!==job)return;render(st);
  if(current?.key!==st.key){current={repo:st.repo,sha:st.sha.slice(0,7),key:st.key};show(current)}
  if(st.snapshot&&st.snapshot!==shownSnap)refreshCity(st.snapshot);
  if(st.status==="done"){fetch(`/api/find?repo=${st.repo}&sha=${st.sha.slice(0,7)}&k=${st.key.split("__").pop()}`).then(r=>r.ok?r.json():null).then(m=>{
      if(m){RECENT=[m,...RECENT.filter(x=>x.key!==m.key)];history.replaceState(null,"","#"+shareHash(m));watching=null;current={...m,src:cityUrl(m.path)};show(current)}});
    setTimeout(()=>{if(!watching)prog.hidden=true},9000);return}
  if(st.status==="error")return;
  const changed=st.seq!==tick.seq;tick.seq=st.seq;poll=setTimeout(()=>tick(job,changed?2000:Math.min(delay*1.4,8000)),changed?2000:delay)}
// a newer snapshot replaces the city, keeping the camera; it waits while a walkthrough or a 2D view is open
function refreshCity(path){pendingSnap=path;let busy=false;
  try{const a=city.contentWindow.cityAPI;busy=!!(a?.flow?.state?.().open||(a?.state&&a.state().view!=="3d"))}catch{}
  if(busy&&shownSnap){clearTimeout(refreshCity.t);refreshCity.t=setTimeout(()=>pendingSnap===path&&refreshCity(path),3000);return}
  loadCity(path,!!shownSnap)}
function render(st){const names={fetch:"Download",structure:"Skyline",describe:"Districts",propose:"Walkthroughs",analysis:"Layers"};
  $("pTitle").textContent=st.status==="done"?`Built ${st.repo}`:st.status==="error"?`Build stopped: ${st.repo}`:`Building ${st.repo}`;
  $("pPct").textContent=(st.pct||0)+"%";$("pBar").style.width=(st.pct||0)+"%";
  const at=st.stages.indexOf(st.stage),done=st.status==="done";
  $("pStages").innerHTML=st.stages.map((x,i)=>`<li class="${done||i<at?"done":i===at?"on":""}">${esc(names[x]||("Walkthrough "+(+x.split(":")[1]+1)))}</li>`).join("");
  $("pLog").innerHTML=(st.log||[]).slice(-8).map(l=>`<div>${esc(l.msg)}</div>`).join("")+(st.error?`<div class="err">${esc(st.error)}</div>`:"");
  $("pLog").scrollTop=1e6;$("pCost").textContent=`AI cost so far $${(+st.cost||0).toFixed(3)}${st.flows_ready?` · ${st.flows_ready} walkthrough${st.flows_ready>1?"s":""} ready to play`:""}`}
$("pX").onclick=()=>{prog.hidden=true};

// ---- fullscreen: optional, hidden where the browser or frame can't do it ----
const fs=$("fs"),toast=$("toast");let tt=0;function say(t){toast.textContent=t;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2600)}
if(!document.fullscreenEnabled||!shell.requestFullscreen)fs.hidden=true;
fs.onclick=()=>{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return}
  shell.requestFullscreen().then(focusCity).catch(()=>say("Fullscreen isn't available in this view. Try opening the page on its own."))};
document.addEventListener("fullscreenchange",()=>{const on=!!document.fullscreenElement;fs.innerHTML=on?'✕<span class="t"> Exit fullscreen</span>':'⛶<span class="t"> Fullscreen</span>';fs.setAttribute("aria-label",on?"Exit fullscreen":"Fullscreen")});
route();
</script>
